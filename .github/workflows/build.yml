name: 构建与发布

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Release · ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runner: windows-2025
          - platform: ARM64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('**/*.vcxproj', 'Directory.Build.*') }}
          restore-keys: nuget-${{ runner.os }}-${{ matrix.platform }}-

      - name: 校验版本标签
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [xml]$manifest = Get-Content -LiteralPath '.\assets\AudioBule.Package.appxmanifest' -Raw
          $expected = 'v' + ([version]$manifest.Package.Identity.Version).ToString(3)
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "标签应为 $expected，实际为 $env:GITHUB_REF_NAME。" }

      - name: 构建并运行核心测试
        run: .\tools\Build.ps1 -Platform '${{ matrix.platform }}' -Configuration Release -RunTests

      - name: 安装安装包编译器
        run: |
          choco install innosetup --version=6.7.3 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup 编译器安装失败。' }

      - name: 生成安装程序、ZIP、MSIX 与校验文件
        run: .\Packaging\Publish.ps1 -Platform '${{ matrix.platform }}' -Configuration Release -SkipBuild

      - name: 验证首次安装、覆盖安装与卸载
        run: |
          $installer = @(Get-ChildItem -LiteralPath artifacts/packages -Filter '*_Setup.exe')
          if ($installer.Count -ne 1) { throw '安装程序数量错误。' }
          .\Packaging\Test-Installer.ps1 -Installer $installer[0].FullName

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}
          path: |
            artifacts/build/**/test-results.xml
            artifacts/installer-tests/*.log
          if-no-files-found: warn

      - name: 上传可下载产出物
        uses: actions/upload-artifact@v4
        with:
          name: AudioBule-${{ matrix.platform }}
          path: artifacts/packages/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布双架构版本
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: 下载双架构产出物
        uses: actions/download-artifact@v4
        with:
          pattern: AudioBule-*
          merge-multiple: true
          path: packages

      - name: 创建 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = @'
          原生 C++ / WinUI 3 蓝牙音频接收工具。

          - x64：适用于 Intel / AMD 64 位 Windows。
          - arm64：适用于 Windows on ARM。
          - 推荐下载对应架构的 `_Setup.exe`，双击安装。离线依赖自动安装，并创建开始菜单快捷方式和系统卸载入口，无需手动运行脚本。
          - 安装程序尚未签名，Windows 可能显示“未知发布者”或 SmartScreen 提示；受组织策略限制的电脑可能无法运行。
          - ZIP 为便携包，首次使用需运行包内 Install-Runtime.ps1。MSIX 为未签名开发包，常规安装请选择 Setup.exe。
          - .sha256 文件用于核对下载文件的 SHA-256。

          需要 Windows 10 2004 或更高版本与蓝牙硬件。先在系统设置配对手机，再在应用中刷新、连接并播放音频。
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          $files = @(Get-ChildItem -LiteralPath packages -File | ForEach-Object FullName)
          if ($files.Count -ne 8) { throw "预期 8 个发布文件，实际为 $($files.Count)。" }
          gh release create $env:GITHUB_REF_NAME @files --repo $env:GITHUB_REPOSITORY --verify-tag --title "AudioBule $env:GITHUB_REF_NAME" --notes-file $notesPath --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release 发布失败。' }
